<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBridge AI — Sprint Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #0b0a0f;
      --bg-card: #121118;
      --border-color: #221f30;
      --accent-color: #7c5cff;
      --accent-hover: #6949e6;
      --text-main: #f4f3f6;
      --text-muted: #9895a5;
      --accent-success: #10b981;
      --accent-error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .file-area {
      margin-bottom: 16px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 12px;
      background: var(--bg-main);
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: var(--border-color);
      color: var(--text-main);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      height: 150px;
      background-color: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      margin-bottom: 20px;
    }

    textarea:focus, input[type="file"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .primary-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .primary-btn:hover {
      background-color: var(--accent-hover);
    }

    .primary-btn:disabled {
      background-color: var(--border-color);
      color: var(--text-muted);
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    /* Bento Grid Workspace Styles */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 10px;
    }

    .bento-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .content-box {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* Quiz Rendering UI Components */
    .quiz-question {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .quiz-question:last-child {
      border-bottom: none;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .option-btn {
      text-align: left;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
      background: rgba(124, 92, 255, 0.05);
    }

    .quiz-explanation {
      margin-top: 10px;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>EduBridge AI</h1>
    <p class="subtitle">Instant study summaries, mnemonics, and test metrics</p>

    <div id="input-section">
      <div class="file-area">
        <label for="file-upload">Upload Lecture Materials:</label>
        <input type="file" id="file-upload" accept=".pdf,.docx,.pptx">
      </div>

      <label for="notes-input">Or Paste Raw Study Text:</label>
      <textarea id="notes-input" placeholder="Type or paste your lecture content here..."></textarea>

      <button id="generate-btn" class="primary-btn">Generate Study Sprint</button>
    </div>

    <div id="workspace-section" class="hidden">
      <div class="bento-grid">
        
        <div class="bento-card">
          <div class="card-title">💡 Core Sprint Summary</div>
          <div id="summary-content" class="content-box">Processing elements...</div>
        </div>

        <div class="bento-card">
          <div class="card-title">🧠 Retention Mnemonic</div>
          <div id="mnemonic-content" class="content-box" style="font-weight: 600; color: #a78bfa;">Processing elements...</div>
        </div>

        <div class="bento-card">
          <div class="card-title">📝 Active Sprint Assessment</div>
          <div id="quiz-content" class="content-box">Processing elements...</div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
