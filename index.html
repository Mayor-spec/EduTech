<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduBridge AI — Light & Friendly Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-success: #10b981;
      --accent-error: #ef4444;
      --bg-bento-card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(244, 63, 94, 0.03) 0px, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 36px 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02), 0 8px 10px -6px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(0, 0, 0, 0.01);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.75px;
      background: linear-gradient(to right, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 32px;
      font-weight: 500;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 10px;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .file-area {
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: block;
      width: 100%;
      padding: 16px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    input[type="file"]:hover {
      border-color: var(--accent-color);
      background: #eef2ff;
    }

    input[type="file"]::-webkit-file-upload-button {
      background: var(--bg-card);
      color: var(--accent-color);
      border: 1px solid #cbd5e1;
      padding: 6px 14px;
      border-radius: 8px;
      margin-right: 12px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    textarea {
      width: 100%;
      height: 160px;
      background-color: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      margin-bottom: 24px;
      transition: all 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-color);
      background-color: var(--bg-card);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-color), #4f46e5);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
      transition: all 0.2s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }

    .primary-btn:disabled {
      background: #e2e8f0;
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .hidden {
      display: none !important;
    }

    /* Bento Grid Friendly Update */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 10px;
    }

    .bento-card {
      background: var(--bg-bento-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--accent-color);
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .content-box {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--text-main);
    }

    /* Fresh Card Element Overrides */
    .content-box h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .content-box h3:first-child {
      margin-top: 0;
    }

    /* Quiz System Visual Upgrades */
    .quiz-question {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .quiz-question:last-child {
      border-bottom: none;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .option-btn {
      text-align: left;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
      background: #f5f3ff;
      transform: translateX(2px);
    }

    .quiz-explanation {
      margin-top: 12px;
      padding: 12px 16px;
      background: #f1f5f9;
      border-radius: 8px;
      border-left: 4px solid var(--accent-color);
      animation: fadeIn 0.25s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>EduBridge AI</h1>
    <p class="subtitle">Instant study summaries, mnemonics, and test metrics</p>

    <div id="input-section">
      <div class="file-area">
        <label for="file-upload">Upload Lecture Materials:</label>
        <input type="file" id="file-upload" accept=".pdf,.docx,.pptx">
      </div>

      <label for="notes-input">Or Paste Raw Study Text:</label>
      <textarea id="notes-input" placeholder="Type or paste your lecture content here..."></textarea>

      <button id="generate-btn" class="primary-btn">Generate Study Sprint</button>
    </div>

    <div id="workspace-section" class="hidden">
      <div class="bento-grid">
        
        <div class="bento-card" style="border-top: 4px solid var(--accent-color);">
          <div class="card-title">✨ Core Sprint Summary</div>
          <div id="summary-content" class="content-box">Processing elements...</div>
        </div>

        <div class="bento-card" style="border-top: 4px solid #ec4899; background: #fffdfa;">
          <div class="card-title" style="color: #ec4899;">🧠 Retention Mnemonic</div>
          <div id="mnemonic-content" class="content-box" style="font-weight: 600; color: #475569;">Processing elements...</div>
        </div>

        <div class="bento-card" style="border-top: 4px solid #10b981;">
          <div class="card-title" style="color: #10b981;">📝 Active Sprint Assessment</div>
          <div id="quiz-content" class="content-box">Processing elements...</div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
